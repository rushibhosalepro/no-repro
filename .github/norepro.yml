# No Repro config for this repo: it watches its own issues and tests the ShopLite demo app.
app:
  name: ShopLite
  description: A small online shop. Browse and search products, add them to a cart, apply a coupon, place an order.
  start: bun demo/shoplite/server.ts
  baseUrl: http://localhost:3000
  ready: /health
  reset: POST /__reset
  pages:
    - path: /
      description: Product list with a search box
    - path: /cart
      description: Cart with quantity controls, coupon field, totals and the Place Order button
    - path: /orders
      description: List of placed orders

replay:
  runs: 3

# openrouter (OPENROUTER_API_KEY) or anthropic (ANTHROPIC_API_KEY).
provider: openrouter
model: anthropic/claude-opus-5.5

limits:
  maxRunsPerIssue: 5
